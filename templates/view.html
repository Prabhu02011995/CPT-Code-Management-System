<!DOCTYPE html>
<html>

<head>

    <title>View CPT Codes</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>View CPT Codes</h1>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>CPT Code</th>
                <th>Procedure Name</th>
                <th>Description</th>
                <th>Category</th>
                <th>Fee</th>
                <th>Status</th>
            </tr>

        </thead>

        <tbody>

            {% for row in rows %}

            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
                <td>{{ row[4] }}</td>
                <td>{{ row[5] }}</td>
                <td>{{ row[6] }}</td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

    <br>

    <a href="/">
        <button type="button">Back to Home</button>
    </a>

</body>

</html>
