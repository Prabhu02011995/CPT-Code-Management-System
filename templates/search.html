<!DOCTYPE html>
<html>

<head>

    <title>Search CPT Code</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <h1>Search CPT Code</h1>

    <form method="POST">

        <p>
            <label>Enter CPT Code:</label><br>
            <input type="text" name="cpt_code" required>
        </p>

        <button type="submit">Search</button>

    </form>

    {% if row %}

    <h2>Search Result</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>CPT Code</th>
            <th>Procedure Name</th>
            <th>Description</th>
            <th>Category</th>
            <th>Fee</th>
            <th>Status</th>
        </tr>

        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
            <td>{{ row[6] }}</td>
        </tr>

    </table>

    {% elif searched %}

    <p>CPT Code not found.</p>

    {% endif %}

    <br>

    <a href="/">
        <button type="button">Back to Home</button>
    </a>

</body>

</html>
